{% extends "blog/base.html" %}

{% block content %}
    <div class="blog-post">
        <div class="blog-post-header">
            <div>
                <img src="{{ object.author.profile.image.url }}" alt="{{ object.author.username }}'s profile picture" class="post-author-image">
                <a href="{% url 'user-post' object.author.username %}">By {{ object.author }}</a>
                <p>{{ object.date|date:"F d, Y" }}</p>
            </div>
            <div class="blog-post-second">
                <h2>{{ object.title }}</h2>
                {% if user == object.author %}
                    <a class="btn btn-info" href="{% url 'post-update' object.id %}">Update Post</a>
                    <a class="btn btn-danger" href="{% url 'post-delete' object.id %}">Delete Post</a>
                {% endif %}
            </div>
        </div>
        <p>{{ object.content }}</p>
    </div>
{% endblock content %}
