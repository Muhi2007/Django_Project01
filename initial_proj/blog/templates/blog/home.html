{% extends "blog/base.html" %}

{% block content %}
    {% for post in posts %}
        <div class="blog-post">
            <div class="blog-post-header">
                <h2>{{ post.title }}</h2>
                <p>By {{ post.author }} on {{ post.date|date:"F d, Y" }}</p>
            </div>
            <p>{{ post.content }}</p>
        </div>
        <br>
    {% endfor %}
{% endblock content %}
